
<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <title>Jogo Adivinhe um número</title>
    <style>
        html {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        body {
            width: 70%;
            max-width: 900px;
            min-width: 500px;
            margin: 0 40px;
        }
    </style>
</head>

<body>

    <h1>Jogo Adivinhe um número</h1>
    <p>Selecionamos um número aleatório entre <b>1</b> e <b>100</b></p>
    <p>Veja se consegue adivinhar em <b>10</b> chances ou menos.</p>
    <p>Nós lhe diremos se seu palpite está com valor <b>alto</b> ou <b>baixo</b>.</p>

    <div class="form">
        <label for="campoPalpite">Digite seu palpite: </label>
        <input type="text" id="campoPalpite" class="campoPalpite">
        <input type="submit" value="Enviar palpite" class="envioPalpite" onclick="conferirPalpite();">
    </div>

    <div class="cjtoResultados">
        <p class="palpites"></p>
        <p class="ultimoResultado"></p>
        <p class="baixoOuAlto"></p>
    </div>

    <script>
        let numeroAleatorio = Math.floor(Math.random() * 100) + 1;
        let contagemPalpites = 0;
        let finish = false;
        let PalpiteAnterior = "";

        function conferirPalpite() {
            if (finish) return;

            let PalpiteAtual = Number(document.getElementById('campoPalpite').value);

            contagemPalpites++;

            document.querySelector(".palpites").innerHTML += PalpiteAtual + " ";

            if (PalpiteAtual > numeroAleatorio) {
                document.querySelector(".ultimoResultado").innerHTML = "Errado";
                document.querySelector(".baixoOuAlto").innerHTML = "Alto";
            } else if (PalpiteAtual < numeroAleatorio) {
                document.querySelector(".ultimoResultado").innerHTML = "Errado";
                document.querySelector(".baixoOuAlto").innerHTML = "Baixo";
            } else {
                document.querySelector(".ultimoResultado").innerHTML = "Correto";
                document.querySelector(".baixoOuAlto").innerHTML = "";
                finish = true;
            }

            PalpiteAnterior = PalpiteAtual;

            if (contagemPalpites >= 10 && !finish) {
                document.querySelector(".ultimoResultado").innerHTML =
                    "Fim de jogo! O número era " + numeroAleatorio;
                finish = true;
            }
        }
    </script>

</body>
</html>
