
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Filmes</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div id="menu">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" id="pagina-atual" href="forms.html">Formulário</a>
        <a class="nav-link" href="">Dados</a>
        <a class="nav-link" href="">Sobre</a>
    </div>

    <div id="content-form">
        <form id="form" action="" method="post">

            <h1>Cadastrar filme</h1>

            <label for="titulo">Título do filme:</label>
            <input type="text" id="titulo" name="titulo" required>

            <label for="genero">Gênero:</label>
            <select id="genero" name="genero" required>
                <option value="">Selecione um gênero</option>
                <option value="Animacao">Animação</option>
                <option value="Aventura">Aventura</option>
                <option value="Fantasia">Fantasia</option>
                <option value="Comedia">Comédia</option>
                <option value="Musical">Musical</option>
            </select>

            <label for="ano">Ano de lançamento:</label>
            <input type="number" id="ano" name="ano" min="1900" max="2100" required>

            <label for="diretor">Diretor:</label>
            <input type="text" id="diretor" name="diretor" required>

            <label for="classificacao">Classificação indicativa:</label>
            <select id="classificacao" name="classificacao" required>
                <option value="">Selecione a classificação</option>
                <option value="Livre">Livre</option>
                <option value="10">10 anos</option>
                <option value="12">12 anos</option>
                <option value="14">14 anos</option>
                <option value="16">16 anos</option>
            </select>

            <label for="sinopse">Sinopse:</label>
            <textarea id="sinopse" name="sinopse" rows="4" required></textarea>

            <button type="submit">Cadastrar filme</button>

        </form>
    </div>

</body>
</html>
